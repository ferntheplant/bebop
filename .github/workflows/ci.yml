name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    # A real Postgres, because the component tests exercise the things a fake would paper
    # over: transactional idempotency, `FOR UPDATE SKIP LOCKED`, advisory locks, and the
    # `jsonb`/`bigint` encodings `prototypes/persistence` pinned down. Those suites skip without
    # one, so this service is what makes Milestone 3's first exit criterion actually
    # enforced rather than merely intended.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bebop
          POSTGRES_PASSWORD: bebop
          POSTGRES_DB: bebop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bebop -d bebop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      BEBOP_TEST_DATABASE_URL: postgres://bebop:bebop@127.0.0.1:5432/bebop
      # Vite Task schedules `@bebop/contracts#build` more than once per `vp run ready`
      # (once via `ready → check → root#build`, once per smoke `dependsOn: { task: "build",
      # from: [...] }`). Run concurrently, the second `vp pack` empties `packages/contracts/dist`
      # while a smoke child is importing it, surfacing as `Cannot find module '@bebop/contracts'`
      # inside the packed artifacts. Run serially, the second pack always completes first. The
      # latent duplicate-scheduling bug is upstream in vite-plus; this is the no-code workaround.
      VP_RUN_CONCURRENCY_LIMIT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Validate workspace
        run: vp run ready

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: vp exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
