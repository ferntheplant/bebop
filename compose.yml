# Stateful local dependencies only (see `AGENTS.md`).
#
# Bebop itself runs from `vp run dev` or a packed artifact; this file exists so component
# tests have a real Postgres to talk to without one being installed on the machine.
#
#   docker compose up -d --wait postgres
#   bun scripts/dev-db.ts
#   vp run test:integration
#
# Port 5433 rather than 5432 so this cannot collide with a Postgres the developer already
# runs for something else.
#
# The project name is pinned so every checkout on the machine shares one container:
# without it, compose would derive the project from the checkout's directory, and a
# second `docker compose up` from a git worktree would try to bind port 5433 again.
# `name:` keeps it attached to the same `bebop-postgres-1` from any checkout. Each
# checkout gets its own database on it via `scripts/dev-db.ts`
# (`docs/adr/0049-one-postgres-container-a-database-per-worktree.md`).
name: bebop

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bebop
      POSTGRES_PASSWORD: bebop
      POSTGRES_DB: bebop
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bebop -d bebop"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Tests create and drop databases constantly and nothing here needs to outlive a run.
    tmpfs:
      - /var/lib/postgresql/data
