# Ephemeral Postgres for the persistence spike.
#
# The host port is deliberately unbound so Docker allocates a free one; the spike
# discovers it with `docker compose port`. PLAN section 8 requires fixture setup not to
# depend on occupied ports.
#
# Storage is tmpfs: this database is disposable and must never accumulate state
# between runs, so a spike pass cannot be an artifact of a previous run's rows.

name: bebop-spike-persistence

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bebop
      POSTGRES_PASSWORD: spike-password
      POSTGRES_DB: bebop_spike
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bebop -d bebop_spike"]
      interval: 1s
      timeout: 3s
      retries: 40
